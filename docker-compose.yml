# Local one-command run: `docker compose up --build`
services:
  conventus:
    build: .
    ports:
      - "7860:7860"
    environment:
      ROOM_PASSWORD: ${ROOM_PASSWORD:-conventus}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      SECRET_KEY: ${SECRET_KEY:-change-me-please}
      ROOM_NAME: ${ROOM_NAME:-Conventus}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-100}
      # --- Call rooms (WebRTC) ---------------------------------------------
      # Call media is peer-to-peer; the server only relays signaling. STUN
      # (below) connects peers on most networks. For users behind strict or
      # symmetric NATs, run a TURN server and uncomment the TURN_* lines.
      # See DEPLOY.md → "Call rooms (TURN)".
      STUN_URLS: ${STUN_URLS:-stun:stun.l.google.com:19302}
      # TURN_URLS: ${TURN_URLS:-turn:turn.example.com:3478}
      # TURN_USERNAME: ${TURN_USERNAME:-conventus}
      # TURN_PASSWORD: ${TURN_PASSWORD:-a-strong-shared-secret}
    volumes:
      - conventus-data:/data

volumes:
  conventus-data:
