name: Deploy to Hugging Face Space

# Pushes this repo to the Hugging Face Docker Space on every push to main,
# which triggers the Space to rebuild the container. One-time setup:
#   - Create a Docker Space.
#   - Add an `HF_TOKEN` repository *secret* (a write token from hf.co/settings/tokens).
#   - Target Space: katospiegel/conventus.
#   - Set ROOM_PASSWORD / ADMIN_PASSWORD / SECRET_KEY as *Space* secrets.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-hf-space
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Prepare Hugging Face deploy snapshot
        run: |
          git checkout --orphan hf-deploy
          git rm -rf --cached . >/dev/null

          cat hf-space-header.yml README.md > README.hf.md
          mv README.hf.md README.md

          RAW_BASE="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}"
          sed -i -E "s#src=\"docs/img/#src=\"${RAW_BASE}/docs/img/#g" README.md
          sed -i -E "s#\]\(img/#](${RAW_BASE}/docs/img/#g" docs/content.md docs/index.html

          rm -rf docs/img

          if find . -type f \( -name '*.png' -o -name '*.jpg' -o -name '*.jpeg' -o -name '*.gif' -o -name '*.webp' -o -name '*.pdf' -o -name '*.zip' \) | grep .; then
            echo "::error::Hugging Face plain git rejects binary files. Strip them or move them to Xet/LFS."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy snapshot from ${GITHUB_SHA}"

      - name: Push to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::Set the HF_TOKEN repository secret (see DEPLOY.md)."
            exit 1
          fi

          echo "Deploying ${GITHUB_SHA} to https://huggingface.co/spaces/katospiegel/conventus"
          git push --force \
            "https://katospiegel:$HF_TOKEN@huggingface.co/spaces/katospiegel/conventus.git" \
            hf-deploy:main
