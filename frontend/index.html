<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#14211a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Conventus" />
    <!-- Fonts load from the <head>, in parallel with the app bundle. As a CSS
         @import they loaded serially after the stylesheet parsed, which left a
         long window where the login painted in fallback fonts and then
         "blinked" into Fraunces/Nunito. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Nunito:wght@400;500;600;700;800&display=swap"
    />
    <title>Conventus</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Theme variables (light/dark) are injected here, then user CSS after,
         so user customizations always win over the active theme. -->
    <style id="conventus-theme"></style>
    <style id="conventus-user-css"></style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
